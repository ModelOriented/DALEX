name: Python-check

on:
  push:
    branches: [master, 'dev*', 'fix*', 'issue*', 'python*', 'doc*', gh-actions, githubactions]
    paths: ['python/dalex/**', 'tox.ini', '.github/workflows/Python-check.yaml']
  pull_request:
    paths: ['python/dalex/**', 'tox.ini', '.github/workflows/Python-check.yaml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  pandas-only-package:
    name: Installed wheel / pandas-only core / Python 3.14
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: |
          python -m pip install --upgrade pip build
          python -m build python/dalex --wheel --outdir wheelhouse
          python -m pip install wheelhouse/*.whl
          python -m pip check
      - name: Validate installed package without Polars/Arrow/model extras
        run: |
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/python/dalex/ci/smoke_pandas_only.py" --assert-minimal --output "$GITHUB_WORKSPACE/pandas-only-package.json"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pandas-only-package
          path: pandas-only-package.json

  upstream-compatibility:
    name: Upstream pandas numerical and pickle compatibility / Python 3.14
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ModelOriented/DALEX
          ref: 77ea3ad9580a3b68aaa94d8dca75d11bd527848f
          path: legacy-reference
          sparse-checkout: python/dalex
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install compatible reference and migrated-package dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --only-binary=numpy,pandas,scipy,pyarrow,scikit-learn,statsmodels,polars,polars-runtime-32,matplotlib,scikit-image,shap 'pandas>=2.3,<3' -e ./python/dalex -r python/dalex/ci/requirements.txt
          python -m pip freeze > compatibility-versions.txt
      - name: Compare numerical outputs with unmodified upstream
        run: python python/dalex/ci/compare_legacy.py --reference-root legacy-reference/python/dalex --output upstream-parity.json
      - name: Load actual upstream explanation pickles and reuse legacy CP/Aspect objects
        run: python python/dalex/ci/check_legacy_pickles.py --reference-root legacy-reference/python/dalex --output upstream-pickle-compatibility.json
      - name: Compare complete pandas plot payloads with unmodified upstream
        run: python python/dalex/ci/compare_plots.py --reference-root legacy-reference/python/dalex --output upstream-plot-parity.json
      - name: Compare legacy helper contracts and index-sensitive callbacks
        run: python python/dalex/ci/compare_legacy_adapters.py --reference-root legacy-reference/python/dalex --output upstream-adapter-parity.json
      - name: Compare pandas 3 feature and group label contracts
        run: |
          python -m pip install 'pandas>=3,<4'
          python -m pip check
          python -m pip freeze > compatibility-pandas3-versions.txt
          python python/dalex/ci/compare_legacy_adapters.py --labels-only --reference-root legacy-reference/python/dalex --output upstream-labels-pandas3.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-compatibility
          path: |
            upstream-parity.json
            upstream-pickle-compatibility.json
            upstream-plot-parity.json
            upstream-adapter-parity.json
            compatibility-versions.txt
            upstream-labels-pandas3.json
            compatibility-pandas3-versions.txt

  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }} / pandas ${{ matrix.pandas || '<3' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        pandas: ['<3']
        include:
          - os: windows-latest
            python: '3.14'
            pandas: '<3'
          - os: ubuntu-latest
            python: '3.14'
            pandas: '>=3,<4'
    env:
      PYTHON_GIL: '1'
      EXPECT_GIL: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Verify interpreter build and initial GIL state
        run: python python/dalex/ci/verify_runtime.py --interpreter-only
      - name: Provide LightGBM OpenMP runtime on macOS
        if: runner.os == 'macOS'
        run: brew list libomp >/dev/null 2>&1 || brew install libomp
      - name: Install package and full test dependencies
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --only-binary=numpy,pandas,scipy,pyarrow,scikit-learn,statsmodels,polars,polars-runtime-32,matplotlib,scikit-image,shap 'pandas${{ matrix.pandas || '<3' }}' -e ./python/dalex -r python/dalex/ci/requirements.txt 2>&1 | tee dependency-install.log
          python -m pip freeze > dependency-versions.txt
      - name: Verify interpreter and GIL after dependency imports
        run: python python/dalex/ci/verify_runtime.py
      - name: Run full suite including mandatory pandas and Polars tests
        run: python -m pytest -vv -ra --timeout=120 --timeout-method=thread python/dalex/test --junitxml=test-results.xml
      - name: Save test and dependency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.python }}-${{ matrix.os }}-pandas${{ matrix.pandas == '>=3,<4' && '3' || '2' }}
          path: |
            test-results.xml
            dependency-versions.txt
            dependency-install.log

  free-threaded:
    name: Python 3.14t / ubuntu-latest / GIL disabled
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHON_GIL: '0'
      EXPECT_GIL: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      # Polars publishes cp314t binaries on conda-forge, but not PyPI.
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.83.0
          manifest-path: python/dalex/ci/free-threaded/pixi.toml
          locked: true
      - name: Verify free-threaded build before scientific imports
        run: pixi run --manifest-path python/dalex/ci/free-threaded/pixi.toml python python/dalex/ci/verify_runtime.py --interpreter-only
      - name: Install package and full free-threaded test dependencies
        run: |
          pixi run --manifest-path python/dalex/ci/free-threaded/pixi.toml python -m pip install --only-binary=numpy,pandas,scipy,pyarrow,scikit-learn,statsmodels,matplotlib,scikit-image,shap 'pandas>=3,<4' -e ./python/dalex -r python/dalex/ci/requirements.txt 2>&1 | tee dependency-install.log
          pixi run --manifest-path python/dalex/ci/free-threaded/pixi.toml python -m pip check
          pixi run --manifest-path python/dalex/ci/free-threaded/pixi.toml python -m pip freeze > dependency-versions.txt
      - name: Verify actual GIL state after dependency imports
        run: pixi run --manifest-path python/dalex/ci/free-threaded/pixi.toml python python/dalex/ci/verify_runtime.py 2>&1 | tee runtime-state.log
      - name: Record dependency automatic GIL fallback without forcing its state
        run: pixi run --manifest-path python/dalex/ci/free-threaded/pixi.toml python python/dalex/ci/probe_gil_imports.py
      - name: Run complete suite with GIL disabled
        run: pixi run --manifest-path python/dalex/ci/free-threaded/pixi.toml python -m pytest -vv -ra --timeout=120 --timeout-method=thread python/dalex/test --junitxml=test-results.xml
      - name: Save free-threaded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-3.14t-ubuntu-latest
          path: |
            test-results.xml
            dependency-versions.txt
            dependency-install.log
            runtime-state.log
            gil-import-probe.json

  backend-benchmark:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model: [sklearn-numpy, sklearn-native, lightgbm-native]
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install -e ./python/dalex 'pandas<3' polars pyarrow scikit-learn 'lightgbm>=4.7,<5' psutil
      - run: python python/dalex/benchmarks/bench_variable_importance_backends.py --model ${{ matrix.model }} --sizes 1000 10000 --repetitions 3 --rounds 2
      - run: python python/dalex/benchmarks/bench_variable_importance_backends.py --model ${{ matrix.model }} --sizes 1000 10000 --repetitions 3 --rounds 2 --warm-runtime --output-prefix dalex-narwhals-benchmark-warm
      - uses: actions/upload-artifact@v4
        with:
          name: dalex-narwhals-benchmark-${{ matrix.model }}
          path: dalex-narwhals-benchmark*

  neural-backends:
    name: Neural SHAP / ${{ matrix.framework }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: torch
            python: '3.14'
          - framework: tensorflow
            python: '3.13'
    env:
      DALEX_NEURAL_FRAMEWORK: ${{ matrix.framework }}
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
      CUDA_VISIBLE_DEVICES: '-1'
      TF_CPP_MIN_LOG_LEVEL: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ./python/dalex pytest shap polars pyarrow matplotlib
      - if: matrix.framework == 'torch'
        run: python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - if: matrix.framework == 'tensorflow'
        # Stable TensorFlow does not currently publish cp314 wheels.
        run: python -m pip install 'tensorflow==2.21.*'
      - run: |
          python -m pip check
          python -m pip freeze > neural-versions.txt
          python -m pytest -vv -ra python/dalex/integration_tests/test_neural_backends.py --junitxml=neural-tests.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neural-${{ matrix.framework }}
          path: |
            neural-tests.xml
            neural-versions.txt

  minimum-polars:
    name: Python 3.14 / Polars 1.0 / Narwhals 2.0 / Plotly 6.0
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install -e ./python/dalex -r python/dalex/ci/requirements.txt 'pandas<3' polars==1.0.0 narwhals==2.0.0 plotly==6.0.0
      - run: |
          python -m pip check
          python -m pip freeze > minimum-polars-versions.txt
          python -m pytest -vv -ra --timeout=120 --timeout-method=thread python/dalex/test --junitxml=minimum-polars.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimum-polars
          path: |
            minimum-polars.xml
            minimum-polars-versions.txt

  minimum-pandas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: python -m pip install -e ./python/dalex -r python/dalex/ci/requirements.txt numpy==1.23.5 pandas==1.5.3 narwhals==2.0.0 'scikit-learn<1.7'
      - run: |
          python -m pip check
          python -m pip freeze > minimum-versions.txt
          python -m pytest -vv -ra --timeout=120 --timeout-method=thread python/dalex/test --junitxml=minimum-pandas.xml
      - name: Validate optional PPS in its compatible legacy dependency environment
        env:
          DALEX_TEST_PPS: '1'
        run: |
          python -m pip install 'setuptools<81' wheel 'scikit-learn<1.7'
          python -m pip install --no-build-isolation ppscore==1.3.0
          python python/dalex/ci/check_pps_backends.py
          python -m pytest -vv -ra --timeout=120 --timeout-method=thread python/dalex/test/test_aspect.py --junitxml=legacy-pps-tests.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimum-pandas
          path: |
            minimum-pandas.xml
            minimum-versions.txt
            pps-backend-parity.json
            legacy-pps-tests.xml

  legacy-estimator-bridge:
    name: Windows Python 3.10 / LightGBM 4.6 / explicit model bridge
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      POLARS_MAX_THREADS: '8'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: python -m pip install -e ./python/dalex pytest pytest-timeout numpy==1.23.5 pandas==1.5.3 polars==2.0.0 pyarrow==25.0.1 narwhals==2.0.0 scikit-learn==1.6.1 lightgbm==4.6.0
      - run: |
          python -m pip check
          python -m pip freeze > legacy-estimator-versions.txt
          python -m pytest -vv -ra --timeout=120 --timeout-method=thread python/dalex/test/test_legacy_estimator_bridges.py --junitxml=legacy-estimator-bridge.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-estimator-bridge
          path: |
            legacy-estimator-bridge.xml
            legacy-estimator-versions.txt
