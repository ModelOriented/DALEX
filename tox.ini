[tox]
envlist = py{310,311,312,313,314}
toxworkdir={toxinidir}/python/dalex/.tox
temp_dir={toxinidir}/python/dalex/.tmp
setupdir={toxinidir}/python/dalex/
skip_missing_interpreters=false

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

[testenv]
changedir = {toxinidir}/python/dalex/test
commands = pytest -q -ra
setenv =
    OMP_NUM_THREADS=1
    OPENBLAS_NUM_THREADS=1
    MKL_NUM_THREADS=1
deps = -r{toxinidir}/python/dalex/ci/requirements.txt
